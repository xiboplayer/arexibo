name: Build Arexibo RPM

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    uses: xiboplayer/.github/.github/workflows/build-rpm.yml@cb1cc4593f5292fa2d5bd9c69b2d5c49dddde55a  # main
    with:
      package-name: arexibo
      rpm-spec: 'rpm/arexibo.spec'
      fedora-matrix: '["43", "44"]'
      arch-matrix: '["x86_64", "aarch64"]'
      source-tarball: 'full'
      gpg-sign: true
      default-version: '0.4.1'
      publish-to-repo: true
    secrets: inherit
